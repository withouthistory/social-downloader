<script>
    let simInterval;

    function startSimulatedProgress() {
        const wrapper = document.getElementById('progressWrapper');
        const bar = document.getElementById('progressBar');
        const text = document.getElementById('progressText');
        const pct = document.getElementById('progressPercent');
        
        wrapper.style.display = 'block';
        bar.style.width = '0%';
        pct.innerText = '0%';
        text.innerText = 'Extracting media...';
        
        let width = 0;
        
        // Simulates the progress jumping up, then slowing down as it approaches 90%
        simInterval = setInterval(() => {
            if (width < 90) {
                // Random increments to feel authentic
                let increment = Math.random() * (90 - width) * 0.1; 
                width += increment > 0.5 ? increment : 0.5;
                
                if (width > 90) width = 90;
                
                bar.style.width = width + '%';
                pct.innerText = Math.floor(width) + '%';
                
                if (width > 50) text.innerText = 'Processing metadata...';
                if (width > 80) text.innerText = 'Finalizing file...';
            }
        }, 400);
    }

    function completeProgress() {
        clearInterval(simInterval);
        document.getElementById('progressBar').style.width = '100%';
        document.getElementById('progressPercent').innerText = '100%';
        document.getElementById('progressText').innerText = 'Ready!';
    }

    async function extractVideo() {
        const urlInput = document.getElementById('videoUrl');
        const btn = document.getElementById('extractBtn');
        const wrapper = document.getElementById('progressWrapper');
        const result = document.getElementById('result');
        
        if (!urlInput.value) return;

        btn.disabled = true;
        result.style.display = 'none';
        
        startSimulatedProgress();

        try {
            const response = await fetch('/api/extract', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput.value })
            });

            const data = await response.json();
            
            completeProgress();

            // Give the bar half a second to show 100% before revealing the video
            setTimeout(() => {
                wrapper.style.display = 'none';
                
                if (data.success) {
                    document.getElementById('videoTitle').innerText = data.title;
                    document.getElementById('thumbnail').src = data.thumbnail;
                    document.getElementById('downloadLink').href = data.download_url;
                    result.style.display = 'block';

		    // THE INJECTION: Unhide the donation links
                    document.getElementById('donation-links').style.display = 'block';

                } else {
                    alert('Engine Error: ' + data.detail);
                }
                btn.disabled = false;
            }, 600);

        } catch (err) {
            clearInterval(simInterval);
            wrapper.style.display = 'none';
            alert('Connection Error: ' + err.message);
            btn.disabled = false;
        }
    }
</script>

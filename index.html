<meta charset="UTF-8">

<style>
    :root { --primary: #6366f1; --accent: #c084fc; --text: #f8fafc; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; padding: 20px; }

    input { width: 100%; padding: 1.2rem; padding-right: 3.5rem; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; color: white; box-sizing: border-box; font-size: 1rem; }
    .paste-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: none; color: #c084fc; padding: 8px 12px; border-radius: 10px; cursor: pointer; }

    .main-btn { width: 100%; padding: 1.2rem; background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border: none; border-radius: 16px; font-weight: 700; cursor: pointer; font-size: 1.1rem; }

    .video-card { background: rgba(255, 255, 255, 0.03); border-radius: 20px; padding: 1.2rem; }
    .video-card img { width: 100%; border-radius: 14px; margin-bottom: 10px; }
    .download-btn { display: block; background: #10b981; padding: 1rem; border-radius: 12px; color: white; text-decoration: none; font-weight: 700; margin-top: 1rem; cursor: pointer; }
    
    .quick-support { display: flex; justify-content: center; gap: 15px; margin-top: 1.2rem; align-items: center;}
    .quick-support span { font-size: 0.85rem; color: #94a3b8; }
    .quick-support a { font-size: 1.3rem; transition: transform 0.2s; text-decoration: none; display: flex; align-items: center; }

<body>

<div class="campaign-banner">
    <span>Support WithoutHustle</span>
    <div class="support-links">
        <a href="https://ko-fi.com/withouthistory" target="_blank"><img src="https://storage.ko-fi.com/cdn/brandasset/v2/kofi_symbol.png" alt="Ko-fi" style="width: 22px; height: 22px; vertical-align: middle;"></a>

        <a href="https://buymeacoffee.com/WithoutHistory" target="_blank"><i class="fas fa-coffee"></i></a>
    </div>
</div>

<div class="container">
    <h1>WithoutHustle</h1>
    <p style="color:#94a3b8; margin-bottom: 2rem; font-size: 0.8rem; text-transform: uppercase;">By Without History</p>
    
    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="Paste link here...">
        <button class="paste-btn" onclick="pasteFromClipboard()"><i class="fas fa-paste"></i></button>
    </div>
    
    <div class="format-selector">
        <div id="opt-mp4" class="format-option active" onclick="setFormat('mp4')">Video</div>
        <div id="opt-mp3" class="format-option" onclick="setFormat('mp3')">Audio (MP3)</div>
    </div>
    
    <button id="extractBtn" class="main-btn" onclick="extractVideo()">Get media</button>
    
    <div class="quick-support">
        <span>Support this free tool:</span>
        <a href="https://ko-fi.com/withouthistory" target="_blank"><img src="https://storage.ko-fi.com/cdn/brandasset/v2/kofi_symbol.png" width="24"></a>
        <a href="https://buymeacoffee.com/withouthistory" target="_blank"><i class="fas fa-coffee" style="color:#ffdd00"></i></a>
        <a href="https://www.patreon.com/c/WithoutHistory" target="_blank"><i class="fab fa-patreon" style="color:#ff424d"></i></a>
    </div>

    <div id="progressWrapper" style="display:none; margin-top: 1.5rem; text-align:center; color:#94a3b8; font-size:0.85rem;">Extracting media...</div>
    
    <div id="result">
        <div class="video-card">
            <img id="thumbnail" src="">
            <h3 id="videoTitle" style="font-size:1rem; font-weight:400; color:white; margin:10px 0;"></h3>
            <p id="fileSizeDisplay" style="font-weight:700; color:#c084fc; margin: 10px 0;"></p>
            <a id="downloadLink" class="download-btn">Download Media</a>
            <a id="fallbackLink" style="font-size:0.8rem; color:#64748b; text-decoration:underline; display:block; margin-top:15px;">Direct Link (Use if buffering hangs)</a>
        </div>
    </div>
</div>

<footer>v1.1.6</footer>

<script>
    let selectedFormat = 'mp4';
    
    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('videoUrl').value = text;
        } catch(e) { alert("Enable clipboard permissions in your browser."); }
    }
    
    function setFormat(val) {
        selectedFormat = val;
        document.getElementById('opt-mp4').classList.toggle('active', val==='mp4');
        document.getElementById('opt-mp3').classList.toggle('active', val==='mp3');
    }
    
    async function extractVideo() {
        const url = document.getElementById('videoUrl').value;
        if(!url) return;
        
        const btn = document.getElementById('extractBtn');
        btn.disabled = true; btn.innerText = "Extracting...";
        document.getElementById('progressWrapper').style.display = 'block';
        document.getElementById('result').style.display = 'none';
        
        try {
            const res = await fetch('/api/extract', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url, format: selectedFormat})
            });
            const data = await res.json();
            
            if(data.success) {
                document.getElementById('videoTitle').innerText = data.title;
                document.getElementById('thumbnail').src = data.thumbnail;
                document.getElementById('fileSizeDisplay').innerText = `File Size: ${data.filesize_mb} MB`;
                document.getElementById('fallbackLink').href = data.download_url;
                
                const dlBtn = document.getElementById('downloadLink');
                dlBtn.innerText = selectedFormat === 'mp3' ? "Download MP3" : "Download Video";
                
                dlBtn.onclick = (e) => {
                    e.preventDefault();
                    handleSmartDownload(data.download_url, data.download_url.split('/').pop());
                };
                
                document.getElementById('result').style.display = 'block';
            } else {
                alert('Engine Error: ' + (data.detail || 'Unknown error'));
            }
        } catch(e) { alert("Extraction failed."); }
        
        btn.disabled = false; btn.innerText = "Get media";
        document.getElementById('progressWrapper').style.display = 'none';
    }
    
    async function handleSmartDownload(url, name) {
        const btn = document.getElementById('downloadLink');
        const oldText = btn.innerText;
        
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if (isMobile && navigator.canShare) {
            btn.innerText = "Buffering..."; 
            btn.style.pointerEvents = 'none';
            try {
                const res = await fetch(url);
                const blob = await res.blob();
                const file = new File([blob], name, {type: blob.type});
                if(navigator.canShare({files: [file]})) {
                    await navigator.share({files: [file]});
                } else {
                    const a = document.createElement('a'); a.href = window.URL.createObjectURL(blob); a.download = name; a.click();
                }
            } catch(e) { console.log("Share cancelled or failed"); }
            btn.innerText = oldText; 
            btn.style.pointerEvents = 'auto';
        } else {
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }
</script>
</body>

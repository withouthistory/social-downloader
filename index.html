<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-xl shadow-lg p-8 max-w-md w-full">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Media Downloader</h1>
        <p class="text-center text-gray-500 mb-6 text-sm">Paste a link from YouTube, X (Twitter), or Instagram</p>

        <form id="downloadForm" class="space-y-4">
            <div>
                <input type="url" id="videoUrl" required
                    placeholder="e.g., https://youtube.com/watch?v=..." 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            
            <button type="submit" id="submitBtn" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200">
                Get Download Link
            </button>
        </form>

        <div id="loading" class="hidden mt-6 text-center">
            <p class="text-blue-600 font-medium animate-pulse">Extracting video... this might take a few seconds.</p>
        </div>

        <div id="resultArea" class="hidden mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <h3 id="videoTitle" class="font-semibold text-gray-800 mb-3 truncate text-sm">Video Title</h3>
            <a id="downloadLink" href="#" target="_blank" 
                class="block w-full text-center bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded transition">
                Download .MP4
            </a>
        </div>
        
        <div id="errorArea" class="hidden mt-6 p-4 bg-red-50 text-red-600 rounded-lg border border-red-200 text-sm text-center">
        </div>
    </div>

    <script>
        document.getElementById('downloadForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevents the page from refreshing
            
            const urlInput = document.getElementById('videoUrl').value;
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('resultArea');
            const errorArea = document.getElementById('errorArea');
            
            // Reset UI states
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            resultArea.classList.add('hidden');
            errorArea.classList.add('hidden');

            try {
                // This points exactly to your MacBook's running server!
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    document.getElementById('videoTitle').textContent = data.title;
                    document.getElementById('downloadLink').href = data.download_url;
                    resultArea.classList.remove('hidden');
                } else {
                    throw new Error(data.detail || 'Failed to extract video');
                }
            } catch (error) {
                errorArea.textContent = "Error: " + error.message;
                errorArea.classList.remove('hidden');
            } finally {
                // Restore button state
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50');
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
